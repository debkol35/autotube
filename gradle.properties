# DNS on this network drops lookups under load: cache good answers, never cache failures, retry more.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dsun.net.inetaddr.ttl=-1 -Dsun.net.inetaddr.negative.ttl=0 -Dorg.gradle.internal.repository.max.retries=12 -Dorg.gradle.internal.repository.initial.backoff=1500
org.gradle.workers.max=2
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
